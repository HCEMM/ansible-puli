name: Molecule

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  molecule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Molecule with Docker support
        run: |
          python -m pip install --upgrade pip
          pip install molecule[docker] ansible

      - name: Run Molecule
        run: molecule test -s default
        env:
          ANSIBLE_FORCE_COLOR: '1'
nodeprofiles:
  default:
    comment: This profile is automatically included for each node
    ipxe template: default
    runtime overlay:
      - hosts
      - ssh.authorized_keys
    system overlay:
      - wwinit
      - wwclient
      - fstab
      - hostname
      - ssh.host_keys
      - issue
      - resolv
      - udev.netname
      - systemd.netname
      - ifcfg
      - NetworkManager
      - debian.interfaces
    kernel:
      args:
        - quiet
        - crashkernel=no
        - net.ifnames=1
    ipmi:
      template: ipmitool.tmpl
    init: /sbin/init
    root: initramfs
    resources:
      fstab:
        - file: /home
          mntops: defaults,nofail
          spec: warewulf:/home
          vfstype: nfs
        - file: /opt
          mntops: defaults,nofail,ro
          spec: warewulf:/opt
          vfstype: nfs
        - file: /scratch/csensen
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/scratch/csensen
          vfstype: nfs
        - file: /scratch/jsequeira
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/scratch/jsequeira
          vfstype: nfs
        - file: /scratch/klamsa
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/scratch/klamsa
          vfstype: nfs
        - file: /scratch/lpongor
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/scratch/lpongor
          vfstype: nfs
        - file: /scratch/mroland
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/scratch/mroland
          vfstype: nfs
        - file: /scratch/sjuhasz
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/scratch/sjuhasz
          vfstype: nfs
        - file: /scratch/tpankotai
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/scratch/tpankotai
          vfstype: nfs
        - file: /scratch/zbiacsi
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/scratch/zbiacsi
          vfstype: nfs
        - file: /scratch/mmanczinger
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/scratch/mmanczinger
          vfstype: nfs
        - file: /scratch/kvince
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/scratch/kvince
          vfstype: nfs
        - file: /scratch/dmathe
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/scratch/dmathe
          vfstype: nfs
        - file: /scratch/cbodor
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/scratch/cbodor
          vfstype: nfs
        - file: /scratch/grost
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/scratch/grost
          vfstype: nfs
        - file: /common
          mntops: defaults,_netdev,nofail
          spec: 10.0.150.147:/mnt/MirrorHDD/common
          vfstype: nfs
        - file: /doctorllm
          mntops: defaults,_netdev,nofail,hard
          spec: 10.0.150.147:/mnt/MirrorHDD/doctorllm
          vfstype: nfs
  nodes:
    profiles:
      - default
    comment: Nodes profile
    runtime overlay:
      - syncuser
    system overlay:
      - nodeconfig
      - cvmfs
    tags:
      ntpserver: 10.0.150.101
      slurmctld: 10.0.150.200

---
# for ((i=0; i<$num_computes; i++)) ; do
#   wwctl node add --image=${image[$i]} --profile=nodes ${c_name[$i]}
# done

- name: Get current node list
  ansible.builtin.command: wwctl node list
  register: wwctl_node_list
  changed_when: false
  check_mode: false

# Prevent duplicate nodes caused by 10g/10G hostname case differences.
# Existing nodes are accepted; new nodes use the standardized 10G naming.
- name: Initialize extracted node names list
  ansible.builtin.set_fact:
    extracted_node_names: []

- name: Extract node names from wwctl output
  ansible.builtin.set_fact:
    extracted_node_names: "{{ extracted_node_names + [item.split(' ')[0]] }}"
  loop: "{{ wwctl_node_list.stdout_lines }}"
  when: item is search('^scc-')  # skip headers

- name: Normalize existing node names for comparison
  ansible.builtin.set_fact:
    extracted_node_names_lower: "{{ extracted_node_names | map('lower') | list }}"

# Map lowercase node names to their actual Warewulf names.
# Existing nodes keep their current name; new nodes use the standardized 10G name.
- name: Initialize existing node name map
  ansible.builtin.set_fact:
    existing_node_name_map: {}

- name: Initialize compute node map
  ansible.builtin.set_fact:
    compute_node_map: {}

- name: Build compute node map
  ansible.builtin.set_fact:
    compute_node_map: >-
      {{
        compute_node_map
        | combine({ (item.c_name | lower): item })
      }}
  loop: "{{ compute_nodes }}"

- name: Build existing node name map
  ansible.builtin.set_fact:
    existing_node_name_map: >-
      {{
        existing_node_name_map
        | combine({ (item | lower): item })
      }}
  loop: "{{ extracted_node_names }}"

- name: Initialize nodes to add list
  ansible.builtin.set_fact:
    nodes_to_add_filtered: []

- name: Filter nodes that are not yet present
  ansible.builtin.set_fact:
    nodes_to_add_filtered: "{{ nodes_to_add_filtered + [item] }}"
  loop: "{{ compute_nodes }}"
  loop_control:
    label: "{{ item.c_name }}"
  when:
    - (item.c_name | lower) not in extracted_node_names_lower

# wwctl node add --image=${image} --profile=nodes ${c_name}
- name: Add node if it does not exist
  ansible.builtin.command: >
    wwctl node add
    --image={{ item.image }}
    --profile=nodes
    {{ item.c_name }}
  loop: "{{ nodes_to_add_filtered }}"
  loop_control:
    label: "{{ item.c_name }}"
  changed_when:
    - nodes_to_add_filtered | length > 0

# wwctl node list ${actual_node_name} -a
- name: Get current node network configuration
  ansible.builtin.command:
    cmd: >-
      wwctl node list
      {{ existing_node_name_map.get(item.c_name | lower, item.c_name) }}
      -a
  loop: "{{ compute_nodes }}"
  loop_control:
    label: "{{ item.c_name }}"
  register: current_node_configs
  changed_when: false
  check_mode: false

# Parse Warewulf network fields into a FIELD -> VALUE map.
# This allows exact comparison of each network setting instead of
# checking whether a value appears somewhere in the command output.
- name: Initialize current node network fields
  ansible.builtin.set_fact:
    current_node_fields: {}

- name: Build current node network fields
  ansible.builtin.set_fact:
    current_node_fields: >-
      {%- set ns = namespace(fields={}) -%}
      {%- for line in item.stdout_lines -%}
        {%- if 'NetDevs[' in line or 'PrimaryNetDev' in line -%}
          {%- set parts = line.split() -%}
          {%- if parts | length >= 4 -%}
            {%- set _ = ns.fields.update({parts[1]: parts[3]}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{
        current_node_fields
        | combine({
            (item.item.c_name | lower): ns.fields
          })
      }}
  loop: "{{ current_node_configs.results }}"
  loop_control:
    label: "{{ item.item.c_name }}"

# wwctl node set -y ${c_name} --netname=bond0 --netdev=bond0 --type=Bond --mtu=9000 \
#   --ipaddr=${c_ip} --netmask=${internal_netmask} \
#   --nettagadd=DNS=${bridge_dns} --nettagadd=miimon=${bond_miimon} \
#   --nettagadd=mode=${bond_mode} --nettagadd=xmit_hash_policy=${bond_xmit_hash_policy} \
#   --nettagadd=route1=0.0.0.0/0,10.0.150.101,300 \
#   --nettagadd=route1_options=mtu=1500
- name: Configure bond interface when required
  ansible.builtin.command:
    argv:
      - wwctl
      - node
      - set
      - -y
      - "{{ existing_node_name_map.get(item.item.c_name | lower, item.item.c_name) }}"
      - "--netname={{ bond_name }}"
      - "--netdev={{ bond_name }}"
      - --type=Bond
      - --mtu=9000
      - "--ipaddr={{ item.item.c_ip }}"
      - "--netmask={{ internal_netmask }}"
      - "--nettagadd=DNS={{ bridge_dns }}"
      - "--nettagadd=miimon={{ bond_miimon }}"
      - "--nettagadd=mode={{ bond_mode }}"
      - "--nettagadd=xmit_hash_policy={{ bond_xmit_hash_policy }}"
      - "--nettagadd=route1=0.0.0.0/0,{{ ipv4_gateway }},300"
      - --nettagadd=route1_options=mtu=1500
  loop: "{{ current_node_configs.results }}"
  loop_control:
    label: "{{ item.item.c_name }}"
  register: bond_config_result
  vars:
    bond_fields: "{{ current_node_fields.get(item.item.c_name | lower, {}) }}"
  when: >
    bond_fields.get('NetDevs[' ~ bond_name ~ '].Type', '') != 'Bond'
    or bond_fields.get('NetDevs[' ~ bond_name ~ '].Device', '') != bond_name
    or bond_fields.get('NetDevs[' ~ bond_name ~ '].Ipaddr', '') != item.item.c_ip
    or bond_fields.get('NetDevs[' ~ bond_name ~ '].Netmask', '') != internal_netmask
    or bond_fields.get('NetDevs[' ~ bond_name ~ '].Gateway', '') != ''
    or bond_fields.get('NetDevs[' ~ bond_name ~ '].Tags[DNS]', '') != bridge_dns
    or bond_fields.get('NetDevs[' ~ bond_name ~ '].Tags[miimon]', '') != (bond_miimon | string)
    or bond_fields.get('NetDevs[' ~ bond_name ~ '].Tags[mode]', '') != bond_mode
    or bond_fields.get('NetDevs[' ~ bond_name ~ '].Tags[xmit_hash_policy]', '') != bond_xmit_hash_policy
    or bond_fields.get('NetDevs[' ~ bond_name ~ '].Tags[route1]', '') != ('0.0.0.0/0,' ~ ipv4_gateway ~ ',300')
    or bond_fields.get('NetDevs[' ~ bond_name ~ '].Tags[route1_options]', '') != 'mtu=1500'
    or bond_fields.get('NetDevs[' ~ bond_name ~ '].MTU', '') != '9000'

# wwctl node set -y ${c_name} --netname=${nic} --netdev=${nic} \\
#   --hwaddr=${mac} --mtu=9000 --nettagadd=master=bond0
# The first NIC also keeps the node IP/netmask used for provisioning/PXE.
- name: Configure physical bond members when required
  ansible.builtin.command: >
    wwctl node set -y
    {{ existing_node_name_map.get(item.0.c_name | lower, item.0.c_name) }}
    --netname={{ item.1.name }}
    --netdev={{ item.1.name }}
    --hwaddr={{ item.1.mac }}
    --mtu=9000
    --nettagadd=master={{ bond_name }}
    {% if item.1.name == item.0.bond_members[0].name %}
    --ipaddr={{ item.0.c_ip }}
    --netmask={{ internal_netmask }}
    {% endif %}
  loop: "{{ compute_nodes | subelements('bond_members') }}"
  loop_control:
    label: "{{ item.0.c_name }} -> {{ item.1.name }}"
  register: physical_nic_config_result
  when: >
    current_node_fields.get(item.0.c_name | lower, {}).get('NetDevs[' ~ item.1.name ~ '].Device', '') != item.1.name
    or (current_node_fields.get(item.0.c_name | lower, {}).get('NetDevs[' ~ item.1.name ~ '].Hwaddr', '') | lower) != (item.1.mac | lower)
    or current_node_fields.get(item.0.c_name | lower, {}).get('NetDevs[' ~ item.1.name ~ '].Tags[master]', '') != bond_name
    or current_node_fields.get(item.0.c_name | lower, {}).get('NetDevs[' ~ item.1.name ~ '].MTU', '') != '9000'
    or (
      item.1.name == item.0.bond_members[0].name
      and (
        current_node_fields.get(item.0.c_name | lower, {}).get('NetDevs[' ~ item.1.name ~ '].Ipaddr', '') != item.0.c_ip
        or current_node_fields.get(item.0.c_name | lower, {}).get('NetDevs[' ~ item.1.name ~ '].Netmask', '') != internal_netmask
      )
    )

# wwctl node set -y ${c_name} --primarynet=${first_bond_member}
- name: Configure primary network interface when required
  ansible.builtin.command: >
    wwctl node set -y
    {{ existing_node_name_map.get(item.c_name | lower, item.c_name) }}
    --primarynet={{ item.bond_members[0].name }}
  loop: "{{ compute_nodes }}"
  loop_control:
    label: "{{ item.c_name }} -> {{ item.bond_members[0].name }}"
  register: primary_net_config_result
  when:
    - current_node_fields.get(item.c_name | lower, {}).get('PrimaryNetDev', '') != item.bond_members[0].name

- name: Trigger overlay/configure after node or network config change
  ansible.builtin.set_fact:
    overlay_needs_rebuild: >-
      {{
        (nodes_to_add_filtered | length > 0)
        or
        (bond_config_result is changed)
        or
        (physical_nic_config_result is changed)
        or
        (primary_net_config_result is changed)
      }}

# wwctl overlay build
- name: Build overlays if node config changed
  ansible.builtin.command: wwctl overlay build
  changed_when: overlay_needs_rebuild
  when: overlay_needs_rebuild

# wwctl configure --all
- name: Configure warewulf if node config changed
  ansible.builtin.command: wwctl configure --all
  changed_when: overlay_needs_rebuild
  when: overlay_needs_rebuild

# for ((i=0; i<${num_computes}; i++)) ; do
#   ipmitool -E -I lanplus -H ${c_bmc[$i]} -U ${bmc_username} \\
#     -P ${bmc_password} chassis power reset
# done
- name: Get WW node status
  ansible.builtin.command: wwctl node status
  register: node_status
  changed_when: false
  check_mode: false

# wwctl node status
# Identify nodes whose last-seen value is missing or exceeds the threshold.
- name: Find nodes that are missing or stale
  ansible.builtin.set_fact:
    nodes_to_reset: >-
      {%- set ns = namespace(nodes=[]) -%}
      {%- for line in node_status.stdout_lines -%}
        {%- set parts = line.split() -%}
        {%- if parts | length >= 4 and parts[0] is match('^scc-') -%}
          {%- set last_seen = parts[3] -%}
          {%- if last_seen == '--' or
                 (last_seen is match('^[0-9]+$') and
                  (last_seen | int) >= (finalize_provision_node_lastseen_threshold | int)) -%}
            {%- set ns.nodes = ns.nodes + [parts[0]] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.nodes }}
  when:
    - finalize_provision_allow_reset | default(false) | bool

- name: Reset non-available nodes
  ansible.builtin.command: >
    ipmitool -E -I lanplus
    -H {{ compute_node_map[item | lower].c_bmc }}
    -U {{ bmc_username }}
    -P {{ bmc_password }}
    chassis power reset
  loop: "{{ nodes_to_reset | default([]) }}"
  loop_control:
    label: "{{ item }}"
  changed_when: nodes_to_reset | default([]) | length > 0
  when:
    - finalize_provision_allow_reset | default(false) | bool
    - nodes_to_reset | default([]) | length > 0
    - (item | lower) in compute_node_map

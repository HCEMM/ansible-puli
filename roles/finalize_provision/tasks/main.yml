---
# for ((i=0; i<$num_computes; i++)) ; do
#   wwctl node add --image=almalinux-9 --profile=nodes --netname=default \
#   --ipaddr=${c_ip[$i]} --hwaddr=${c_mac[$i]} ${c_name[i]}
# done
- name: Get current node list
  ansible.builtin.command: wwctl node list
  register: wwctl_node_list
  changed_when: false

- name: Initialize extracted node names list
  ansible.builtin.set_fact:
    extracted_node_names: []

- name: Extract node names from wwctl output
  ansible.builtin.set_fact:
    extracted_node_names: "{{ extracted_node_names + [item.split(' ')[0]] }}"
  loop: "{{ wwctl_node_list.stdout_lines }}"
  when: item is search('^scc-')  # skip headers

- name: Filter nodes that are not yet present
  ansible.builtin.set_fact:
    nodes_to_add_filtered: >-
      {{ compute_nodes | rejectattr('c_name', 'in', extracted_node_names) | list }}

- name: Add node if it does not exist
  ansible.builtin.command: >
    wwctl node add
    --image=almalinux-9
    --profile=nodes
    --netname=default
    --ipaddr={{ item.c_ip }}
    --hwaddr={{ item.c_mac }}
    {{ item.c_name }}
  loop: "{{ nodes_to_add_filtered }}"
  loop_control:
    label: "{{ item.c_name }}"
  changed_when:
    - nodes_to_add_filtered | length > 0
  when:
    - inventory_hostname in groups['sms']

- name: Trigger overlay/configure after node add
  ansible.builtin.set_fact:
    overlay_needs_rebuild: nodes_to_add_filtered | length > 0

# wwctl overlay build
- name: Build overlays if node config changed
  ansible.builtin.command: wwctl overlay build
  changed_when: overlay_needs_rebuild
  when: overlay_needs_rebuild

# wwctl configure --all
- name: Configure warewulf if node config changed
  ansible.builtin.command: wwctl configure --all
  changed_when: overlay_needs_rebuild
  when: overlay_needs_rebuild

# for ((i=0; i<${num_computes}; i++)) ; do
#   ipmitool -E -I lanplus -H ${c_bmc[$i]} -U ${bmc_username} -P ${bmc_password} chassis power reset
# done
- name: Get WW node status
  ansible.builtin.command: wwctl node status
  register: node_status
  changed_when: false

- name: Find nodes that are missing or stale
  ansible.builtin.set_fact:
    nodes_to_reset: >-
      {{
        node_status.stdout_lines
        | select('match', '^scc-')
        | map('split')
        | selectattr('3', 'defined')
        | selectattr('3', 'in', ['--'] + (range(finalize_provision_node_lastseen_threshold, 1000000) | map('string') | list))
        | map(attribute=0)
        | list
      }}

- name: Reset non-available nodes
  ansible.builtin.command: >
    ipmitool -E -I lanplus -H {{ (compute_nodes | selectattr('c_name', 'equalto', item) | first).c_bmc }}
    -U {{ bmc_username }} -P {{ bmc_password }} chassis power reset
  loop: "{{ nodes_to_reset }}"
  loop_control:
    label: "{{ item }}"
  changed_when: nodes_to_reset | length > 0
  when:
    - nodes_to_reset | length > 0
    - ( inventory_hostname in groups['sms'] )
    - env == 'production'

- name: Deploy Checkmk local checks for Slurm node monitoring
  when:
    - inventory_hostname in groups['slurmctld']
  block:
    - name: Deploy Slurm nodes check
      ansible.builtin.template:
        src: check_slurm_nodes.j2
        dest: /usr/lib/check_mk_agent/local/check_slurm_nodes
        owner: root
        group: root
        mode: '0755'

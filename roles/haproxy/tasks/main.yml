---
- name: Configure SSH proxy on SMS using HAProxy
  when:
    - inventory_hostname in groups['sms']
  block:

    - name: Install HAProxy
      ansible.builtin.dnf:
        name:
          - haproxy
        state: present

    - name: Ensure /etc/ssh/sshd_config.d exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Move sshd away from port 22 so HAProxy can bind :22
    - name: Configure sshd on SMS to use admin port (free port 22 for HAProxy)
      when:
        - sms_move_sshd_off_22 | default(true) | bool
      block:
        - name: Deploy sshd drop-in for SMS (admin port)
          ansible.builtin.template:
            src: sms-sshd.conf.j2
            dest: /etc/ssh/sshd_config.d/sms-sshd.conf
            owner: root
            group: root
            mode: "0644"
          notify: Restart sshd

        - name: Validate sshd config
          ansible.builtin.command: sshd -t
          changed_when: false

        - name: Ensure sshd is started/enabled
          ansible.builtin.systemd:
            name: sshd
            state: started
            enabled: true

    - name: Deploy HAProxy config (SSH proxy)
      ansible.builtin.template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
      notify: Restart haproxy

    - name: Validate HAProxy config
      ansible.builtin.command: haproxy -c -f /etc/haproxy/haproxy.cfg
      changed_when: false

    - name: Detect firewalld state
      ansible.builtin.command: firewall-cmd --state
      register: fw_state
      changed_when: false
      failed_when: false

    - name: Open firewall service ssh (port 22) for users on SMS
      when: fw_state.stdout == "running"
      ansible.posix.firewalld:
        service: ssh
        permanent: true
        state: enabled
        immediate: true

    # Optional open the admin ssh port on SMS if we moved sshd off 22
    - name: Open firewall admin ssh port on SMS
      when:
        - fw_state.stdout == "running"
        - sms_move_sshd_off_22 | default(true) | bool
      ansible.posix.firewalld:
        port: "{{ sms_sshd_admin_port | default(2222) }}/tcp"
        permanent: true
        state: enabled
        immediate: true

    # Optional SELinux helper (safe to run even if permissive/disabled)
    - name: Enable SELinux boolean for HAProxy outbound connections
      ansible.builtin.command: setsebool -P haproxy_connect_any 1
      register: sebool_set
      changed_when: sebool_set.rc == 0
      failed_when: false

    - name: Ensure HAProxy is started/enabled
      ansible.builtin.systemd:
        name: haproxy
        state: started
        enabled: true

    - name: Flush handlers (apply restarts now)
      ansible.builtin.meta: flush_handlers


- name: Configure sshd policy on Login Nodes (bind to primary IP)
  when:
    - inventory_hostname in groups['login_nodes']
  block:

    - name: Ensure /etc/ssh/sshd_config.d exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy sshd drop-in for login nodes
      when: login_nodes_bind_sshd_to_primary_ip | default(true) | bool
      ansible.builtin.template:
        src: loginnode-sshd.conf.j2
        dest: /etc/ssh/sshd_config.d/loginnode-sshd.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart sshd

    - name: Validate sshd config
      when: login_nodes_bind_sshd_to_primary_ip | default(true) | bool
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Ensure sshd is started/enabled
      ansible.builtin.systemd:
        name: sshd
        state: started
        enabled: true

    - name: Flush handlers (apply restarts now)
      ansible.builtin.meta: flush_handlers

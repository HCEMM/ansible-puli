login_nodes_per_user_limits:
  cpu_quota: "200%"
  tasks_max: 512
  memory_high: "3G"
  memory_max: "4G"
  memory_swap_max: "0"

login_nodes_global_limits:
  cpu_quota: "70%"
  tasks_max: 4096
  memory_high: "26G"
  memory_max: "28G"
  memory_swap_max: "2G"

login_nodes_runtime_limits:
  cpu_time_soft: 7200
  cpu_time_hard: 10800

login_nodes_session_cleanup:
  enabled: true
  ssh_max_age_seconds: 28800        # 8 hours
  rdp_max_age_seconds: 604800       # 7 days
  timer_on_boot: "10min"
  timer_interval: "1h"

---
- name: Check if package is installed in Warewulf image - {{ pkg }}
  ansible.builtin.command: >
    wwctl image exec --build=false {{ image }} /bin/bash -c 'rpm -q {{ pkg }}'
  register: "pkg_check"
  changed_when: false
  failed_when: false

- name: Install package into Warewulf image - {{ pkg }}
  ansible.builtin.command: >
     | wwctl image exec --build=false {{ image }} /bin/bash -c 'dnf -y install {{ pkg }}'
  when: lookup('vars', 'pkg_check').rc != 0
  changed_when: lookup('vars', 'pkg_check').rc != 0

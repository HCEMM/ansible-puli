---
# dnf install -y install http://repos.openhpc.community/OpenHPC/3/EL_9/x86_64/ohpc-release-3-1.el9.x86_64.rpm
- name: Install OpenHPC repo
  ansible.builtin.dnf:
    name: http://repos.openhpc.community/OpenHPC/3/EL_9/x86_64/ohpc-release-3-1.el9.x86_64.rpm
    state: present
  when:
    ( inventory_hostname in groups['sms'] )

# dnf -y install dnf-plugins-core
- name: Install dnf plugins
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  when:
    ( inventory_hostname in groups['sms'] )

# dnf -y config-manager --set-enabled crb
- name: Ensure the crb repository is enabled
  community.general.dnf_config_manager:
    name: crb
    state: enabled
  when:
    ( inventory_hostname in groups['sms'] )

# dnf -y install ohpc-base
# dnf -y install warewulf-ohpc hwloc-ohpc
- name: Install OpenHPC base packages
  ansible.builtin.dnf:
    name:
      - ohpc-base
      - warewulf-ohpc
      - hwloc-ohpc
      - ohpc-slurm-server
    state: present
  when:
    ( inventory_hostname in groups['sms'] )

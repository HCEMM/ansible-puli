---
# export CHROOT=$(wwctl image show almalinux-9)
- name: Get Warewulf chroot path for almalinux-9
  ansible.builtin.command: wwctl image show almalinux-9
  register: chroot_path_result
  changed_when: false

- name: Extract chroot path from wwctl output
  ansible.builtin.set_fact:
    chroot_path: "{{ chroot_path_result.stdout }}"

# perl -pi -e 's/# End of file/\* soft memlock unlimited\n$&/s' /etc/security/limits.conf
# perl -pi -e 's/# End of file/\* hard memlock unlimited\n$&/s' /etc/security/limits.conf
- name: Ensure memlock limits in sms limits.conf
  ansible.builtin.lineinfile:
    path: "/etc/security/limits.conf"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    insertbefore: '^# End of file'
  loop:
    - { regexp: '^\* soft memlock unlimited', line: '* soft memlock {{ cn_max_memory_soft }}' }
    - { regexp: '^\* hard memlock unlimited', line: '* hard memlock {{ cn_max_memory_hard }}' }
    - { regexp: '^\* soft cpu time unlimited', line: '* soft cpu time {{ cn_max_cpu_soft }}' }
    - { regexp: '^\* hard cpu time unlimited', line: '* hard cpu time {{ cn_max_cpu_hard }}' }
  when:
    - ( inventory_hostname in groups['sms'] )

# perl -pi -e 's/# End of file/\* soft memlock unlimited\n$&/s' $CHROOT/etc/security/limits.conf
# perl -pi -e 's/# End of file/\* hard memlock unlimited\n$&/s' $CHROOT/etc/security/limits.conf
- name: Ensure memlock limits in chroot limits.conf
  ansible.builtin.lineinfile:
    path: "{{ chroot_path }}/etc/security/limits.conf"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    insertbefore: '^# End of file'
  loop:
    - { regexp: '^\* soft memlock unlimited', line: '* soft memlock unlimited' }
    - { regexp: '^\* hard memlock unlimited', line: '* hard memlock unlimited' }
  when:
    - ( inventory_hostname in groups['sms'] )

# echo "account required pam_slurm.so" >> $CHROOT/etc/pam.d/sshd
- name: Add pam_slurm.so to chroot PAM SSHD config
  ansible.builtin.lineinfile:
    path: "{{ chroot_path }}/etc/pam.d/sshd"
    line: "account required pam_slurm.so"
    state: present
    create: true
    mode: '0644'
  when:
    - ( inventory_hostname in groups['sms'] )

# dnf -y install cuda-repo-ohpc
# dnf -y install nvidia-driver-cuda cuda-devel-ohpc
- name: Install CUDA and NVIDIA packages on SMS
  ansible.builtin.dnf:
    name:
      - cuda-repo-ohpc
      - nvidia-driver-cuda
      - cuda-devel-ohpc
    state: present
  when:
    - ( inventory_hostname in groups['sms'] )
    - cn_install_nvidia_drivers

# wwctl image exec --build=false almalinux-9 /bin/bash <<- EOF
# dnf -y install cuda-repo-ohpc
# dnf -y module install nvidia-driver:latest-dkms
# KVER=$(rpm -q --queryformat='%{version}-%{release}.%{arch}\n' \
# kernel-core | sort -r | head -1)
# dkms autoinstall --verbose -k \${KVER}
# dkms status
# EOF
- name: Check if CUDA and NVIDIA packages are installed in image
  ansible.builtin.shell: |
    set -o pipefail; echo rpm -q cuda-repo-ohpc nvidia-driver nvidia-driver-cuda cuda-devel-ohpc dkms | wwctl image exec --build=false almalinux-9 /bin/bash
  register: nvidia_cuda_pkgs
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname in groups['sms']
    - cn_install_nvidia_drivers

- name: Install and configure CUDA and NVIDIA packages on compute nodes
  ansible.builtin.shell:
    set -o pipefail; echo '{{ item }}' | wwctl image exec --build=false almalinux-9 /bin/bash
  loop:
    - dnf -y install cuda-repo-ohpc
    - dnf -y module install nvidia-driver:latest-dkms
    - KVER=$(rpm -q --queryformat='%{version}-%{release}.%{arch}\n' kernel-core | sort -r | head -1); dkms autoinstall --verbose -k \${KVER}
    - dkms status
  changed_when:
    - ( 'package not installed' in nvidia_cuda_pkgs.stdout )
  when:
    - ( inventory_hostname in groups['sms'] )
    - cn_install_nvidia_drivers

# echo 'module(load="imudp")' >> /etc/rsyslog.d/ohpc.conf
# echo 'input(type="imudp" port="514")' >> /etc/rsyslog.d/ohpc.conf
- name: Configure rsyslog for UDP
  ansible.builtin.lineinfile:
    path: "/etc/rsyslog.d/ohpc.conf"
    line: "{{ item }}"
    state: present
    create: true
    mode: '0644'
  loop:
    - "module(load=\"imudp\")"
    - "input(type=\"imudp\" port=\"514\")"
  when:
    - ( inventory_hostname in groups['sms'] )

# systemctl restart rsyslog
- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  when:
    - ( inventory_hostname in groups['sms'] )

# echo "*.* action(type=\"omfwd\" Target=\"${sms_ip}\" Port=\"514\" " \
# "Protocol=\"udp\")">> $CHROOT/etc/rsyslog.conf
- name: Configure rsyslog for UDP in chroot
  ansible.builtin.lineinfile:
    path: "{{ chroot_path }}/etc/rsyslog.d/ohpc.conf"
    line: "*.* action(type=\"omfwd\" Target=\"${sms_ip}\" Port=\"514\" Protocol=\"udp\")"
    state: present
    create: true
    mode: '0644'
  when:
    - ( inventory_hostname in groups['sms'] )

# perl -pi -e "s/^\*\.info/\\#\*\.info/" $CHROOT/etc/rsyslog.conf
# perl -pi -e "s/^authpriv/\\#authpriv/" $CHROOT/etc/rsyslog.conf
# perl -pi -e "s/^mail/\\#mail/" $CHROOT/etc/rsyslog.conf
# perl -pi -e "s/^cron/\\#cron/" $CHROOT/etc/rsyslog.conf
# perl -pi -e "s/^uucp/\\#uucp/" $CHROOT/etc/rsyslog.conf
- name: Disable rsyslog logging in chroot
  ansible.builtin.lineinfile:
    path: "{{ chroot_path }}/etc/rsyslog.conf"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^\*\.info', line: '\#\*\.info' }
    - { regexp: '^authpriv', line: '\#authpriv' }
    - { regexp: '^mail', line: '\#mail' }
    - { regexp: '^cron', line: '\#cron' }
    - { regexp: '^uucp', line: '\#uucp' }
  when:
    - ( inventory_hostname in groups['sms'] )

# dnf -y install nhc-ohpc
- name: Install NHC
  ansible.builtin.dnf:
    name: nhc-ohpc
    state: present
  when:
    - ( inventory_hostname in groups['sms'] )
    - cn_install_nhc

# dnf -y --installroot=$CHROOT install nhc-ohpc
- name: Check if NHC is installed inside image
  ansible.builtin.include_tasks: roles/utils/tasks/install_pkg_on_image.yml
  vars:
    image: almalinux-9
    pkg: nhc-ohpc
  when:
    - inventory_hostname in groups['sms']
    - cn_install_nhc


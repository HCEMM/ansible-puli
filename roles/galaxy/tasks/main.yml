---
- block:
  - name: Install Galaxy dependencies
    ansible.builtin.dnf:
      name: "{{ galaxy_system_packages }}"
      state: present

  - name: Install virtualenv
    ansible.builtin.pip:
      name: virtualenv
      executable: pip3

  - name: Ensure virtualenv symlink exists
    ansible.builtin.file:
      src: /usr/local/bin/virtualenv
      dest: /usr/local/sbin/virtualenv
      state: link

  - name: Install PostgreSQL repository
    ansible.builtin.dnf:
      name: https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm
      state: present
      disable_gpg_check: true

  - name: Include upstream Galaxy role
    ansible.builtin.include_role:
      name: galaxyproject.postgresql
  become: true

- block:
  - name: Include upstream Galaxy role
    ansible.builtin.include_role:
      name: galaxyproject.postgresql_objects
  become: true
  become_user: postgres

- name: Include upstream Galaxy role
  ansible.builtin.include_role:
    name: galaxyproject.galaxy

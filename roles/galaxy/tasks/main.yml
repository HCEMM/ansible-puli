---
# Pre tasks
- name: Install system dependencies
  ansible.builtin.dnf:
    name: "{{ galaxy_dependencies }}"
    state: present

- name: Install pip dependencies
  ansible.builtin.pip:
    name: "{{ galaxy_pip_dependencies }}"
    executable: pip3

# Install tasks
- name: Include PostgreSQL roles
  ansible.builtin.include_role:
    name: galaxyproject.postgresql

- name: Setup PostgreSQL users/databases
  become: true
  become_user: postgres
  block:
    - name: Setup PostgreSQL users/databases
      ansible.builtin.include_role:
        name: galaxyproject.postgresql_objects
      vars:
        postgresql_objects_users:
          - name: "{{ galaxy_db_user }}"
            password: null
        postgresql_objects_databases:
          - name: "{{ galaxy_db_name }}"
            owner: "{{ galaxy_db_user }}"

- name: Include Galaxy role
  ansible.builtin.include_role:
    name: galaxyproject.galaxy

# Config tasks
- name: Deploy galaxy.yml
  ansible.builtin.template:
    src: galaxy.yml.j2
    dest: "{{ galaxy_root }}/config/galaxy.yml"
    owner: "{{ galaxy_user }}"
    group: "{{ galaxy_group }}"
    mode: '0644'
  notify: Restart Galaxy

- name: Deploy gravity.yml
  ansible.builtin.template:
    src: gravity.yml.j2
    dest: "{{ galaxy_root }}/config/gravity.yml"
    owner: "{{ galaxy_user }}"
    group: "{{ galaxy_group }}"
    mode: '0644'
  notify: Restart Galaxy

# Service tasks
- name: Deploy systemd unit
  ansible.builtin.template:
    src: galaxy.service.j2
    dest: /etc/systemd/system/galaxy.service
    mode: '0644'
  notify: Reload systemd

- name: Ensure Galaxy service is enabled and started
  ansible.builtin.systemd:
    name: galaxy
    enabled: true
    state: started

# https://docs.galaxyproject.org/en/master/admin/nginx.html
# sudo usermod -a -G galaxy www-data    # add `www-data` user to `galaxy` group
- name: Add www-data to galaxy group
  ansible.builtin.user:
    name: www-data
    groups: galaxy
    append: true

# sudo -iu galaxy
# umask 027     # set umask so new files are group-readable
- name: Set umask for galaxy user
  ansible.builtin.lineinfile:
    path: /home/galaxy/.bashrc
    line: "umask 027"
  become: true
  become_user: galaxy

- name: Install tusd from github
  ansible.builtin.get_url:
    url: "https://github.com/tus/tusd/releases/download/v2.8.0/tusd_linux_amd64.tar.gz"
    dest: /home/galaxy/tusd_linux_amd64.tar.gz
    mode: '0644'
    owner: galaxy
    group: galaxy

- name: Extract tusd
  ansible.builtin.unarchive:
    src: /home/galaxy/tusd_linux_amd64.tar.gz
    dest: /usr/local/bin/
    remote_src: true

- name: Ensure tusd is executable
  ansible.builtin.file:
    path: /usr/local/bin/tusd
    mode: '0755'

# tusd -host localhost -port 1080 -upload-dir=<galaxy_root>/database/tmp -hooks-http=<galaxy_url>/api/upload/hooks -hooks-http-forward-headers=X-Api-Key,Cookie
- name: Setup tusd service
  ansible.builtin.command: >
    nohup tusd
    -host localhost
    -port 1080
    -upload-dir={{ galaxy_root }}/database/tmp
    -hooks-http={{ galaxy_url }}/api/upload/hooks
    -hooks-http-forward-headers=X-Api-Key,Cookie
    > /home/galaxy/tusd.log 2>&1 &
  changed_when: true
  when: not tusd_service_status.stat.exists

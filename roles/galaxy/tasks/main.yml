---
- name: Install dependencies for Galaxy
  ansible.builtin.dnf:
    name:
      - git
      - policycoreutils-python-utils      # for semanage
      - nfs-utils
      - golang              # to build tusd
      - apptainer
    state: present

- name: Create galaxy group
  ansible.builtin.group:
    name: "{{ galaxy_group }}"
    gid: "{{ galaxy_gid | default(1001) }}"
    state: present

- name: Create galaxy user
  ansible.builtin.user:
    name: "{{ galaxy_user }}"
    groups:
      - "{{ galaxy_group }}"
      - systemd-journal
    state: present
    uid: "{{ galaxy_uid | default(1001) }}"
    create_home: true

- name: Open ports on firewall for Galaxy
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - 8080
    - 1080

# setsebool -P httpd_can_network_connect 1
- name: Enable Selinux httpd traffic
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true

# /srv/galaxy 10.0.150.211(rw,sync,no_subtree_check,no_root_squash) in /etc/exports
- name: Mount /mnt/galaxy
  ansible.posix.mount:
    path: /mnt/galaxy
    src: "10.0.150.211:{{ galaxy_base_dir }}"
    fstype: nfs
    state: mounted

# git clone https://github.com/tus/tusd.git
- name: Clone tusd repository
  ansible.builtin.git:
    repo: 'https://github.com/tus/tusd.git'
    dest: "{{ galaxy_tus_exec_dir }}"
    version: 'v2.8.0'  # Pin to keep idempotency

# go build -o tusd cmd/tusd/main.go
- name: Build tusd binary
  ansible.builtin.command:
    cmd: go build -o tusd cmd/tusd/main.go
    chdir: "{{ galaxy_tus_exec_dir }}"
  args:
    creates: "{{ galaxy_tus_exec_dir }}/tusd"

- name: Clone Galaxy repository
  ansible.builtin.git:
    repo: 'https://github.com/galaxyproject/galaxy'
    dest: "{{ galaxy_base_dir }}"
    version: 'v25.0.4'  # Pin to keep idempotency
    update: false
  become: "{{ galaxy_user }}"

# run.sh
- name: Install Galaxy dependencies
  ansible.builtin.command:
    cmd: ./run.sh
    chdir: "{{ galaxy_base_dir }}"
  become: "{{ galaxy_user }}"
  args:
    creates: "{{ galaxy_base_dir }}/.venv"


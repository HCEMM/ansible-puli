---
- name: Install Python 3.11
  ansible.builtin.dnf:
    name:
      - python3.11
      - python3.11-pip
      - python3.11-devel
      - python3.11-setuptools
      - python3.11-wheel
    state: present

- name: Install dependencies for Galaxy
  ansible.builtin.dnf:
    name:
      - sudo
      - git
      - make
      # - virtualenv        # python3-venv - this one is set on the next tasks
      - python3-setuptools
      - python3-devel     # python3-dev
      - python3-psycopg2
      - gcc
      - acl
      - gnutls-utils      # gnutls-bin
      - file-devel        # libmagic-dev
      - policycoreutils-python-utils      # for semanage
      - nfs-utils
      - golang                            # to build tusd
      - apptainer
      - unzip
      - tar
    state: present

- name: Install virtualenv
  ansible.builtin.pip:
    name: virtualenv
    executable: pip3

- name: Symbolic link for virtualenv
  ansible.builtin.file:
    src: /usr/local/bin/virtualenv
    dest: /usr/local/sbin/virtualenv
    state: link

- name: Open ports on firewall for Galaxy
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - 8080
    - 1080

# setsebool -P httpd_can_network_connect 1
- name: Enable Selinux httpd traffic
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true

- name: Mount /srv/galaxy
  ansible.posix.mount:
    src: "{{ storage_ip }}:/mnt/MirrorHDD/galaxy"
    path: "/srv/galaxy"
    opts: rw,hard,noatime,fsc,nconnect=8
    boot: true
    state: mounted
    fstype: nfs

- name: Include PostgreSQL role
  ansible.builtin.include_role:
    name: galaxyproject.postgresql
    apply:
      become: true

- name: Include PostgreSQL objects role
  ansible.builtin.include_role:
    name: galaxyproject.postgresql_objects
    apply:
      become: true
      become_user: postgres
  vars:
    postgresql_objects_users:
      - name: galaxy
        password: null
    postgresql_objects_databases:
      - name: galaxy
        owner: galaxy

- name: Include Galaxy role
  ansible.builtin.include_role:
    name: galaxyproject.galaxy
    apply:
      become: true

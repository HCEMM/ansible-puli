# sss_cache -E
- name: Restart SSSD (and clear cache)
  ansible.builtin.command: sss_cache -E
  changed_when: true
  failed_when: false
  notify: Restart SSSD Service

# systemctl restart sssd
- name: Restart SSSD Service
  ansible.builtin.service:
    name: sssd
    state: restarted
    enabled: true

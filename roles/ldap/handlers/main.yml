- name: Restart SSSD (and clear cache)
  ansible.builtin.shell: |
    set -euo pipefail
    systemctl restart sssd
    if command -v sss_cache >/dev/null 2>&1; then
      sss_cache -E || true
      systemctl restart sssd
    fi
  args:
    executable: /bin/bash
  changed_when: true


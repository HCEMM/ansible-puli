# ID Range defaults
ldap_idranges:
  - name: "CLUSTER.LOCAL_SYS_10_99999"
    base_id: 10
    range_size: 99990          # 10..99999
    rid_base: 300000
    secondary_rid_base: 600000
    type: "local"
  - name: "CLUSTER.LOCAL_USERS_100000_299999"
    base_id: 100000
    range_size: 200000         # 100000..299999
    rid_base: 1000000
    secondary_rid_base: 2000000
    type: "local"
ldap_user_auth_type: # "otp" already assumes password+otp, no need to specify password separately
  - password
  - otp

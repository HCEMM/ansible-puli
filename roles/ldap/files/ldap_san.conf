[ req ]
default_bits       = 4096
prompt             = no
default_md         = sha256
req_extensions     = req_ext
distinguished_name = dn

[ dn ]
C  = HU
ST = Hungary
L  = Szeged
O  = PuliSupercomputer
OU = IT
CN = ldap.cluster.local

[ req_ext ]
subjectAltName = @alt_names

[ alt_names ]
DNS.1 = ldap.cluster.local
DNS.2 = ldap1.cluster.local
IP.1  = 127.0.0.1
IP.2  = 10.0.150.203
---
- name: Install required packages for virtualization
  ansible.builtin.dnf:
    name:
      - libvirt
      - virt-manager
      - virt-install
      - libguestfs-tools
      - python3-libvirt
    state: present

- name: Ensure libvirtd is started and enabled
  ansible.builtin.service:
    name: libvirtd
    state: started
    enabled: true

- name: Add current user to libvirt group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: libvirt
    append: true

# Next tasks from: https://www.redhat.com/en/blog/build-VM-fast-ansible
- name: Get VMs list
  community.libvirt.virt:
    command: list_vms
  register: existing_vms
  changed_when: false

- name: Create VM if not exists
  when: "setup_vms_vm_name not in existing_vms.list_vms"
  block:
    - name: Download base image
      ansible.builtin.get_url:
        url: "{{ setup_vms_base_image_url }}"
        dest: "/tmp/{{ setup_vms_base_image_name }}"
        checksum: "sha256:{{ setup_vms_base_image_sha }}"
        mode: "0660"

    - name: Copy base image to libvirt directory
      ansible.builtin.copy:
        dest: "{{ setup_vms_libvirt_pool_dir }}/{{ setup_vms_vm_name }}.qcow2"
        src: "/tmp/{{ setup_vms_base_image_name }}"
        force: false
        remote_src: true
        mode: "0660"
      register: copy_results
      notify: Configure the image

    - name: Define vm
      community.libvirt.virt:
        command: define
        xml: "{{ lookup('template', 'vm-template.xml.j2') }}"

- name: Ensure VM is started
  community.libvirt.virt:
    name: "{{ setup_vms_vm_name }}"
    state: running
  register: vm_start_results
  until: "vm_start_results is success"
  retries: 15
  delay: 2

- name: Ensure temporary file is deleted
  ansible.builtin.file:
    path: "/tmp/{{ setup_vms_base_image_name }}"
    state: absent
  when: setup_vms_cleanup_tmp | bool

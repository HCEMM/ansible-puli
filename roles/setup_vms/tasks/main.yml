---
- name: Install required packages for virtualization
  ansible.builtin.dnf:
    name:
      - libvirt
      - virt-manager
      - virt-install
      - libguestfs-tools
      - python3-libvirt
    state: present

- name: Ensure libvirtd is started and enabled
  ansible.builtin.service:
    name: libvirtd
    state: started
    enabled: true

- name: Add current user to libvirt group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: libvirt
    append: true

- name: Configure br0 bridge on host with DHCP
  ansible.builtin.include_tasks: create-bridge.yml
  vars:
    bridge_name: "{{ setup_vms_vm_net }}"
    physical_interface: "{{ ansible_default_ipv4.interface }}"

- name: Download base image
  ansible.builtin.get_url:
    url: "{{ setup_vms_base_image_url }}"
    dest: "/tmp/{{ setup_vms_base_image_name }}"
    checksum: "sha256:{{ setup_vms_base_image_sha }}"
    mode: "0660"

# Next tasks from: https://www.redhat.com/en/blog/build-VM-fast-ansible
- name: Get VMs list
  community.libvirt.virt:
    command: list_vms
  register: existing_vms
  changed_when: false

- name: Process each VM
  ansible.builtin.include_tasks: create-vm.yml
  loop: "{{ setup_vms_vm_list | dict2items }}"
  loop_control:
    loop_var: vm
  vars:
    vm_name: "{{ vm.key }}"
    vm_params: "{{ vm.value }}"

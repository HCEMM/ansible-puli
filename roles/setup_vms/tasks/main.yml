---
- name: Install required packages for virtualization
  ansible.builtin.dnf:
    name:
      - libvirt
      - virt-manager
      - virt-install
      - libguestfs-tools
      - python3-libvirt
    state: present

- name: Ensure libvirtd is started and enabled
  ansible.builtin.service:
    name: libvirtd
    state: started
    enabled: true

- name: Add current user to libvirt group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: libvirt
    append: true

- name: Download base image
  ansible.builtin.get_url:
    url: "{{ setup_vms_base_image_url }}"
    dest: "/tmp/{{ setup_vms_base_image_name }}"
    checksum: "sha256:{{ setup_vms_base_image_sha }}"
    mode: "0660"

- name: Disable firewalld
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: false

- name: Create kickstart directory
  ansible.builtin.file:
    path: /var/www/html/ks
    state: directory
    mode: "0755"

- name: Check if HTTP server is already running
  ansible.builtin.shell: "ss -ltn '( sport = :{{ setup_vms_kickstart_port }} )' | grep {{ setup_vms_kickstart_port }}"
  register: http_port_check
  ignore_errors: true
  changed_when: false

- name: Start local HTTP server for kickstart files
  ansible.builtin.shell: "nohup python3 -m http.server {{ setup_vms_kickstart_port }} --directory /var/www/html --bind 0.0.0.0 &"
  changed_when: true
  when: http_port_check.rc != 0

# Next tasks from: https://www.liquidweb.com/help-docs/server-administration/linux-server-administration/install-kvm-on-linux-almalinux/
- name: Get VMs list
  community.libvirt.virt:
    command: list_vms
  register: existing_vms
  changed_when: false

- name: Identify new VMs to be created
  ansible.builtin.set_fact:
    setup_vms_new_vm_list: >-
      {{
        setup_vms_vm_list
        | dict2items
        | rejectattr('key', 'in', existing_vms.list_vms)
        | list
      }}

- name: Process each VM
  ansible.builtin.include_tasks: create-vm.yml
  loop: "{{ setup_vms_vm_list | dict2items }}"
  loop_control:
    loop_var: vm
  vars:
    vm_name: "{{ vm.key }}"
    vm_params: "{{ vm.value }}"

- name: Decrypt and place root SSH private key (ansible user)
  ansible.builtin.copy:
    src: "id_puli_root"
    dest: ~/.ssh/id_rsa
    mode: '0600'
    decrypt: true

- name: Decrypt and place root SSH private key (root user)
  ansible.builtin.copy:
    src: "id_puli_root"
    dest: /root/.ssh/id_puli_root
    mode: '0600'
    decrypt: true

- name: Add VMs to SSH config (ansible user)
  ansible.builtin.template:
    src: ssh_config.j2
    dest: ~/.ssh/config
    mode: '0600'

- name: Add VMs to SSH config (root user)
  ansible.builtin.template:
    src: ssh_config.j2
    dest: /root/.ssh/config
    mode: '0600'

- name: Add VMs to hosts file
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.value.ip }} {{ item.key }}"
    state: present
  loop: "{{ setup_vms_vm_list | dict2items }}"

- name: Wait for SSH to become available on all VMs (this will take a while, wait ~15 minutes)
  ansible.builtin.wait_for:
    host: "{{ item.value.ip }}"
    port: 22
    state: started
    timeout: 180
  loop: "{{ setup_vms_vm_list | dict2items }}"
  delegate_to: localhost
  run_once: false
  retries: 5
  delay: 10
  register: ssh_wait_result
  until: ssh_wait_result is succeeded

# nmcli -g GENERAL.CONNECTION device show enp1s0
- name: Get active network connection on newly created VMs
  ansible.builtin.command:
    argv:
      - nmcli
      - -g
      - GENERAL.CONNECTION
      - device
      - show
      - enp1s0
  delegate_to: "{{ item.key }}"
  loop: "{{ setup_vms_new_vm_list }}"
  register: vm_active_connections
  changed_when: false
  failed_when: >
    vm_active_connections.rc != 0 or
    (vm_active_connections.stdout | trim) in ['', '--']

# nmcli connection modify <connection_name> \
#   802-3-ethernet.mtu 9000 \
#   ipv4.gateway "" \
#   ipv4.routes "0.0.0.0/0 10.0.150.254 100 mtu=1500"
- name: Configure persistent MTU 9000 and default route MTU 1500 on new VMs
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ item.stdout | trim }}"
      - 802-3-ethernet.mtu
      - "9000"
      - ipv4.gateway
      - ""
      - ipv4.routes
      - "0.0.0.0/0 {{ ansible_default_ipv4.gateway }} 100 mtu=1500"
  delegate_to: "{{ item.item.key }}"
  loop: "{{ vm_active_connections.results }}"
  changed_when: true

# nmcli device reapply enp1s0
- name: Apply network settings on newly created VMs
  ansible.builtin.command:
    argv:
      - nmcli
      - device
      - reapply
      - enp1s0
  delegate_to: "{{ item.key }}"
  loop: "{{ setup_vms_new_vm_list }}"
  when: setup_vms_new_vm_list | length > 0

# ip -4 route show default
- name: Verify active default route MTU on newly created VMs
  ansible.builtin.command:
    argv:
      - ip
      - -4
      - route
      - show
      - default
  delegate_to: "{{ item.key }}"
  loop: "{{ setup_vms_new_vm_list }}"
  register: vm_default_routes
  changed_when: false
  failed_when: >
    vm_default_routes.rc != 0 or
    ('via ' ~ ansible_default_ipv4.gateway) not in vm_default_routes.stdout or
    'mtu 1500' not in vm_default_routes.stdout

# cat /sys/class/net/enp1s0/mtu
- name: Verify active interface MTU on newly created VMs
  ansible.builtin.command:
    argv:
      - cat
      - /sys/class/net/enp1s0/mtu
  delegate_to: "{{ item.key }}"
  loop: "{{ setup_vms_new_vm_list }}"
  register: vm_interface_mtu
  changed_when: false
  failed_when: >
    vm_interface_mtu.rc != 0 or
    (vm_interface_mtu.stdout | trim) != '9000'

- name: Add VMs to known_hosts file (ansible user)
  ansible.builtin.command: >
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts {{ item.key }} exit
  loop: "{{ setup_vms_vm_list | dict2items }}"
  delegate_to: localhost
  changed_when: false

- name: Add VMs to known_hosts file (root user)
  ansible.builtin.command: >
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/root/.ssh/known_hosts {{ item.key }} exit
  loop: "{{ setup_vms_vm_list | dict2items }}"
  delegate_to: localhost
  changed_when: false

# dnf install -y epel-release
- name: Install EPEL repository
  ansible.builtin.dnf:
    name: epel-release
    state: present
  delegate_to: "{{ item.key }}"
  loop: "{{ setup_vms_vm_list | dict2items }}"

- name: Get OS major version of each VM
  ansible.builtin.command:
    argv:
      - rpm
      - -E
      - "%{rhel}"
  delegate_to: "{{ item.key }}"
  loop: "{{ setup_vms_vm_list | dict2items }}"
  register: vm_os_versions
  changed_when: false

- name: Enable CRB or PowerTools repository
  community.general.dnf_config_manager:
    name: "{{ 'powertools' if (item.stdout | trim) == '8' else 'crb' }}"
    state: enabled
  delegate_to: "{{ item.item.key }}"
  loop: "{{ vm_os_versions.results }}"
  when: (item.stdout | trim) in ['8', '9']

- name: Add 10.0.150.101 as ntp server
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    line: "server 10.0.150.101 iburst"
    state: present
  delegate_to: "{{ item.key }}"
  loop: "{{ setup_vms_vm_list | dict2items }}"

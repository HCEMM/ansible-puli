- name: Ensure NetworkManager is installed
  ansible.builtin.package:
    name: NetworkManager
    state: present

- name: Delete any existing bridge/slave connection (safe cleanup)
  community.general.nmcli:
    conn_name: "{{ item }}"
    state: absent
  loop:
    - "{{ bridge_name }}"
    - "bridge-slave-{{ physical_interface }}"

- name: Create bridge connection (with DHCP)
  community.general.nmcli:
    type: bridge
    conn_name: "{{ bridge_name }}"
    ifname: "{{ bridge_name }}"
    state: present
    autoconnect: true
    method4: auto

- name: Add physical interface to bridge
  community.general.nmcli:
    type: ethernet
    conn_name: "bridge-slave-{{ physical_interface }}"
    ifname: "{{ physical_interface }}"
    master: "{{ bridge_name }}"
    state: present
    autoconnect: true

- name: Bring up connections
  community.general.nmcli:
    conn_name: "{{ item }}"
    state: up
  loop:
    - "{{ bridge_name }}"
    - "bridge-slave-{{ physical_interface }}"

- name: Create VM if it doesn't exist
  when: "vm_name not in existing_vms.list_vms"
  block:
    - name: Copy base image to libvirt directory
      ansible.builtin.copy:
        dest: "{{ setup_vms_libvirt_pool_dir }}/{{ vm_name }}.qcow2"
        src: "/tmp/{{ setup_vms_base_image_name }}"
        force: false
        remote_src: true
        mode: "0660"
      notify: Configure the image

    - name: Generate XML definition of image
      community.libvirt.virt:
        command: define
        xml: "{{ lookup('template', 'vm.xml.j2', convert_data=False) }}"
      vars:
        xml_vm_name: "{{ vm_name }}"
        xml_memory: "{{ vm_params.memory }}"
        xml_vcpus: "{{ vm_params.vcpus }}"
        xml_disk: "{{ setup_vms_libvirt_pool_dir }}/{{ vm_name }}.qcow2"
        vm_net: "{{ setup_vms_network }}"
        xml_mac: "{{ vm_params.mac }}"

- name: Ensure VM is started
  community.libvirt.virt:
    name: "{{ vm_name }}"
    state: running
  register: vm_start_results
  until: vm_start_results is success
  retries: 15
  delay: 2

- name: Ensure temporary file is deleted
  ansible.builtin.file:
    path: "/tmp/{{ setup_vms_base_image_name }}"
    state: absent
  when: setup_vms_cleanup_tmp | bool

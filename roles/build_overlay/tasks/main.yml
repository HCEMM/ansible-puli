---
- name: Create /etc/systemd/system/NetworkManager-wait-online.service.d directory if it does not exist
  ansible.builtin.file:
    path: /etc/systemd/system/NetworkManager-wait-online.service.d
    state: directory
    mode: '0700'

- name: Put files on /etc folder before importing into overlay
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0600'
  loop:
    - { src: "{{ role_path }}/files/chrony.conf.ww", dest: /etc/chrony.conf.ww }
    - { src: "{{ role_path }}/files/slurmd.ww", dest: /etc/sysconfig/slurmd.ww }
    - { src: "{{ role_path }}/files/override.conf", dest: /etc/systemd/system/NetworkManager-wait-online.service.d/override.conf }

- name: Check if overlay file exists
  ansible.builtin.stat:
    path: "/srv/warewulf/overlays/nodeconfig/rootfs/etc/{{ item.dest }}"
  loop:
    # wwctl overlay import --parents nodeconfig /etc/subuid
    - { src: /etc/subuid, dest: subuid }
    # wwctl overlay import --parents nodeconfig /etc/subgid
    - { src: /etc/subgid, dest: subgid }
    # echo 'server {{.Tags.ntpserver}} iburst' | \
    # wwctl overlay import --parents nodeconfig <(cat) /etc/chrony.conf.ww
    - { src: /etc/chrony.conf.ww, dest: chrony.conf.ww }
    # cat <<- EOF | wwctl overlay import --parents nodeconfig <(cat) \
    # /etc/systemd/system/NetworkManager-wait-online.service.d/override.conf
    # [Service]
    # ExecStart=/usr/bin/nm-online -q
    # EOF
    - { src: /etc/systemd/system/NetworkManager-wait-online.service.d/override.conf, dest: systemd/system/NetworkManager-wait-online.service.d/override.conf }
    # echo SLURMD_OPTIONS='--conf-server {{.Tags.slurmctld}}' | \
    # wwctl overlay import --parents nodeconfig <(cat) /etc/sysconfig/slurmd.ww
    - { src: /etc/sysconfig/slurmd.ww, dest: sysconfig/slurmd.ww }
    # wwctl overlay import --parents nodeconfig /etc/munge/munge.key
    - { src: /etc/munge/munge.key, dest: munge/munge.key }
  loop_control:
    label: "{{ item.dest }}"
  register: overlay_file_stat

- name: Support unprivileged user namespaces, and configure chrony, systemd, NetworkManager and Slurm server
  ansible.builtin.command: wwctl overlay import --parents nodeconfig {{ item.item.src }}
  loop: "{{ overlay_file_stat.results }}"
  changed_when: not item.stat.exists
  when:
    - not item.stat.exists

# wwctl profile set --yes nodes --tagadd ntpserver=${sms_ip}
# wwctl profile set --yes nodes --tagadd slurmctld=${sms_ip}
- name: Check if master host is identified as local NTP server
  ansible.builtin.include_tasks: roles/utils/tasks/check_output_for_strings.yml
  vars:
    cmd: 'wwctl profile list nodes -a'
    patterns:
      - 'Tags[ntpserver]             {{ sms_ip }}'
      - 'Tags[slurmctld]             {{ sms_ip }}'

- name: Identify master host as local NTP server
  ansible.builtin.command: wwctl profile set --yes nodes --tagadd ntpserver={{ sms_ip }} --tagadd slurmctld={{ sms_ip }}
  changed_when: >
    not output_match_found
  when:
    - not output_match_found

# wwctl overlay chown nodeconfig /etc/munge/munge.key $(id -u munge) $(id -g munge)
# wwctl overlay chown nodeconfig /etc/munge $(id -u munge) $(id -g munge)
- name: Get munge UID
  ansible.builtin.command: id -u munge
  register: munge_uid
  changed_when: false

- name: Get munge GID
  ansible.builtin.command: id -g munge
  register: munge_gid
  changed_when: false

- name: Check current ownership of munge.key in overlay
  ansible.builtin.stat:
    path: /srv/warewulf/overlays/nodeconfig/rootfs/etc/munge/munge.key
  register: munge_key_stat

- name: Set permissions of munge
  ansible.builtin.command: >
    wwctl overlay chown nodeconfig /etc/munge/munge.key {{ munge_uid.stdout }} {{ munge_gid.stdout }}
  changed_when:
    - munge_key_stat.stat.uid != (munge_uid.stdout | int) or
      munge_key_stat.stat.gid != (munge_gid.stdout | int)
  when:
    - munge_key_stat.stat.uid != (munge_uid.stdout | int) or
      munge_key_stat.stat.gid != (munge_gid.stdout | int)

- name: Check current ownership of /etc/munge dir in overlay
  ansible.builtin.stat:
    path: /srv/warewulf/overlays/nodeconfig/rootfs/etc/munge
  register: munge_dir_stat

- name: Set ownership of /etc/munge dir in overlay
  ansible.builtin.command: >
    wwctl overlay chown nodeconfig /etc/munge {{ munge_uid.stdout }} {{ munge_gid.stdout }}
  changed_when:
    - munge_dir_stat.stat.uid != (munge_uid.stdout | int) or
      munge_dir_stat.stat.gid != (munge_gid.stdout | int)
  when:
    - munge_dir_stat.stat.uid != (munge_uid.stdout | int) or
      munge_dir_stat.stat.gid != (munge_gid.stdout | int)

# wwctl overlay chmod nodeconfig /etc/munge 0700
- name: Set permissions on /etc/munge dir in overlay
  ansible.builtin.command: >
    wwctl overlay chmod nodeconfig /etc/munge 0700
  changed_when: munge_dir_stat.stat.mode != '0700'
  when:
    - munge_dir_stat.stat.mode != '0700'

# LDAP configuration: https://ciq.com/blog/joining-warewulf-managed-compute-nodes-to-active-directory/
# wwctl overlay create active-directory
- name: Create active-directory overlay if it does not exist
  ansible.builtin.command: wwctl overlay create active-directory
  changed_when: 'Overlay "active-directory" created' in create_overlay_result.stdout
  register: create_overlay_result
  when: >
    not ( 'active-directory' in
      lookup('ansible.builtin.command', 'wwctl overlay list', wantlist=True) )

# wwctl overlay import active-directory krb5.keytab.ww /etc/krb5.keytab.ww
- name: Import krb5.keytab template into active-directory overlay
  ansible.builtin.command: wwctl overlay import active-directory {{ role_path }}/files/krb5.keytab.ww /etc/krb5.keytab.ww
  changed_when: 'Imported /etc/krb5.keytab.ww into overlay active-directory' in import_krb5_result.stdout
  register: import_krb5_result
  when: >
    not ( 'krb5.keytab.ww' in
      lookup('ansible.builtin.command', 'wwctl overlay list active-directory -f "{{ "{{" }}.Files{{ "}}" }}"', wantlist=True) )

- name: Copy copy-krb5-keytabs.sh to /etc/cron.daily/
  ansible.builtin.copy:
    src: "copy-krb5-keytabs.sh"
    dest: /etc/cron.daily/copy-krb5-keytabs.sh
    owner: root
    group: root
    mode: '0755'


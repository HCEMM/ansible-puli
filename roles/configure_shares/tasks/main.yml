---
- name: Install dependencies for NFS mounts
  ansible.builtin.package:
    name: nfs-utils
    state: present

- name: Create scratch mount points
  ansible.builtin.file:
    path: /scratch/{{ item }}
    state: directory
    mode: '0755'
  loop: "{{ configure_shares_storage_groups }}"

- name: Mount NFS shares
  ansible.posix.mount:
    src: "{{ configure_shares_storage_ip }}:/mnt/MirrorHDD/scratch/{{ item }}"
    path: /scratch/{{ item }}
    opts: rw,sync,soft      # For hard vs soft - https://kb.netapp.com/on-prem/ontap/da/NAS/NAS-KBs/What_are_the_differences_between_hard_mount_and_soft_mount
    boot: true              # automatically mounted on boot
    state: mounted          # ensures the mount is present and configured in fstab
    fstype: nfs
  loop: "{{ configure_shares_storage_groups }}"

- name: Mount home and opt from sms
  ansible.posix.mount:
    src: "{{ sms_ip }}:{{ item }}"
    path: "{{ item }}"
    opts: rw,sync,hard      # I chose hard here to avoid potential data loss on home directories
    boot: true              # automatically mounted on boot
    state: mounted          # ensures the mount is present and configured in fstab
    fstype: nfs
  loop:
    - /home
  when:
    - inventory_hostname in groups['login_nodes']

- name: Mount home and opt from sms
  ansible.posix.mount:
    src: "{{ sms_ip }}:{{ item }}"
    path: "{{ item }}"
    opts: ro,sync,hard      # I chose hard here to avoid potential data loss on home directories
    boot: true              # automatically mounted on boot
    state: mounted          # ensures the mount is present and configured in fstab
    fstype: nfs
  loop:
    - /opt/miniconda3
    - /opt/nvidia
    - /opt/ohpc
  when:
    - inventory_hostname in groups['login_nodes']

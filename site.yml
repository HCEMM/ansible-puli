---
- name: Build main server
  hosts:
    - sms
  any_errors_fatal: true
  become: true
  gather_facts: true

  roles:
    - common
    - chronyd
    - setup_ohpc
    - setup_warewulf
    - setup_slurm
    - build_compute_images
    - customize_nodes
    - build_overlay
    - hpc_toolchain
    - customize_puli
    - setup_modules
    - configure_shares
    - fail2ban
    - setup_vms

- name: Provision computes
  hosts:
    - sms
    - computes
  any_errors_fatal: true
  become: true
  gather_facts: true
  roles:
    - finalize_provision

- name: Install ThinLinc Server
  hosts: thinlinc_servers
  become: true
  gather_facts: true

  roles:
    - role: thinlinc-server
      vars:
        thinlinc_accept_eula: "yes"
        thinlinc_version: "4.19.0"
        thinlinc_server_bundle: "/root/tl-{{ thinlinc_version }}-server.zip"
        thinlinc_build: "4116"
        thinlinc_autoinstall_dependencies: "yes"
        thinlinc_email: joao.sequeira@hcemm.eu
        thinlinc_printers: "no"
        thinlinc_webaccess_port: 443
        thinlinc_webaccess_login_page: "/"    # default value, redirects to the current server
        thinlinc_webadm_port: 1010
        thinlinc_webadm_password: "$6$ef8b0b02b79db5e6$9d6QTuXeVYXFAQmM37UXvHAVUOtMbQBtiUUzq.9qVeY66h.1uyiSxoYNmHm2fOzOV20RIfXaTQm9SGqyx9rJg1"
        thinlinc_hostname_choice: "hostname"
        thinlinc_agent_hostname: "{{ inventory_hostname }}"

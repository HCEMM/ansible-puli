---
- name: Build PULI
  hosts: all
  any_errors_fatal: true
  become: true
  gather_facts: true

  roles:
    - common
    - chronyd
    - setup-ohpc
    - setup-warewulf
    - setup-slurm
    - build-compute-images
    - customize-nodes
    - build-overlay
    - finalize-provision
    - setup-modules
    - configure-shares
    - configure-users
    - customize-puli

# Install pip docker package for ansible
pip_install_packages:
  - name: docker
# RabbitMQ
rabbitmq_container:
  name: rabbit_hole
  image: rabbitmq:4.3.6-management
  hostname: "{{ inventory_hostname }}"

rabbitmq_plugins:
  - rabbitmq_management

rabbitmq_config:
  listeners:
    tcp: none
  ssl_listeners:
    default: 5671
  ssl_options:
    verify: verify_peer
    cacertfile: /etc/ssl/rabbitmq/ca.crt
    certfile: /etc/ssl/rabbitmq/rabbitmq.crt
    keyfile: /etc/ssl/rabbitmq/rabbitmq.key
    fail_if_no_peer_cert: 'false'
    versions:
      - tlsv1.3
      - tlsv1.2
  management_agent:
    disable_metrics_collector: "false"
  management:
    disable_stats: 'false'
  consumer_timeout: 21600000 # 6 hours in milliseconds

rabbitmq_vhosts:
  - /pulsar/pulsar_au

rabbitmq_users:
  - user: admin
    password: "{{ vault_rabbitmq_admin_password }}"
    tags: administrator
    vhost: /
  - user: pulsar_au
    password: "{{ vault_rabbitmq_password_vhost }}"
    vhost: /pulsar/pulsar_au

# Should be put on secrets.yml
vault_rabbitmq_password_vhost: "{{ checkmk_password }}"
vault_rabbitmq_admin_password: "{{ root_password_raw }}"
